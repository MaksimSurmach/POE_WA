name: ${E2E_PROJECT:?E2E_PROJECT is required}

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: poe_worksmith_e2e
      POSTGRES_PASSWORD: e2e-only
      POSTGRES_USER: e2e
    healthcheck:
      test: [CMD-SHELL, pg_isready -h 127.0.0.1 -U e2e -d poe_worksmith_e2e]
      interval: 2s
      timeout: 2s
      retries: 30
    labels:
      com.poe-worksmith.e2e.run: ${E2E_RUN:?E2E_RUN is required}
      com.poe-worksmith.e2e.attempt: ${E2E_ATTEMPT:?E2E_ATTEMPT is required}
      com.poe-worksmith.e2e.owner: master-e2e
    networks: [app]
    volumes: ['pgdata:/var/lib/postgresql/data']

  migrate:
    image: ${SERVER_IMAGE:?SERVER_IMAGE is required}
    command: [node, dist/migrate.js]
    environment: &app_env
      APP_ENV: test
      APP_MODE: api
      APP_HOST: 0.0.0.0
      APP_PORT: 3000
      PIPELINE: collector
      DATABASE_SSL_MODE: disable
      TEST_DATABASE_URL: postgresql://e2e:e2e-only@postgres:5432/poe_worksmith_e2e
      MARKET_COLLECTION_SOURCE: disabled
      POE_TRADE_ACCESS: disabled
      POE_USER_AGENT: 'OAuth poe-worksmith-e2e/1.0 (offline fixture)'
      LOG_LEVEL: info
    depends_on:
      postgres: { condition: service_healthy }
    labels:
      com.poe-worksmith.e2e.run: ${E2E_RUN:?E2E_RUN is required}
      com.poe-worksmith.e2e.attempt: ${E2E_ATTEMPT:?E2E_ATTEMPT is required}
      com.poe-worksmith.e2e.owner: master-e2e
    networks: [app]

  app:
    image: ${SERVER_IMAGE:?SERVER_IMAGE is required}
    command: [node, dist/entrypoints/api.js]
    environment: *app_env
    depends_on:
      migrate: { condition: service_completed_successfully }
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://127.0.0.1:3000/health/ready').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))",
        ]
      interval: 2s
      timeout: 2s
      retries: 30
      start_period: 10s
    labels:
      com.poe-worksmith.e2e.run: ${E2E_RUN:?E2E_RUN is required}
      com.poe-worksmith.e2e.attempt: ${E2E_ATTEMPT:?E2E_ATTEMPT is required}
      com.poe-worksmith.e2e.owner: master-e2e
    networks: [app]

  collector:
    image: ${SERVER_IMAGE:?SERVER_IMAGE is required}
    command:
      [node, '${E2E_COLLECTOR_ENTRYPOINT:-dist/entrypoints/collector.js}']
    environment:
      <<: *app_env
      APP_MODE: collector
      COLLECTOR_RETENTION_ENABLED: 'true'
    volumes:
      ['./scripts/e2e-collector-fixture.mjs:/tmp/e2e-collector-fixture.mjs:ro']
    depends_on:
      migrate: { condition: service_completed_successfully }
    labels:
      com.poe-worksmith.e2e.run: ${E2E_RUN:?E2E_RUN is required}
      com.poe-worksmith.e2e.attempt: ${E2E_ATTEMPT:?E2E_ATTEMPT is required}
      com.poe-worksmith.e2e.owner: master-e2e
    networks: [app]

  web:
    image: ${WEB_IMAGE:?WEB_IMAGE is required}
    depends_on: [app]
    ports: ['127.0.0.1:${E2E_PORT:-18080}:8080']
    labels:
      com.poe-worksmith.e2e.run: ${E2E_RUN:?E2E_RUN is required}
      com.poe-worksmith.e2e.attempt: ${E2E_ATTEMPT:?E2E_ATTEMPT is required}
      com.poe-worksmith.e2e.owner: master-e2e
    networks: [app, browser]

networks:
  app:
    internal: true
    labels:
      com.poe-worksmith.e2e.run: ${E2E_RUN:?E2E_RUN is required}
      com.poe-worksmith.e2e.attempt: ${E2E_ATTEMPT:?E2E_ATTEMPT is required}
      com.poe-worksmith.e2e.owner: master-e2e
  browser:
    labels:
      com.poe-worksmith.e2e.run: ${E2E_RUN:?E2E_RUN is required}
      com.poe-worksmith.e2e.attempt: ${E2E_ATTEMPT:?E2E_ATTEMPT is required}
      com.poe-worksmith.e2e.owner: master-e2e

volumes:
  pgdata:
    labels:
      com.poe-worksmith.e2e.run: ${E2E_RUN:?E2E_RUN is required}
      com.poe-worksmith.e2e.attempt: ${E2E_ATTEMPT:?E2E_ATTEMPT is required}
      com.poe-worksmith.e2e.owner: master-e2e
