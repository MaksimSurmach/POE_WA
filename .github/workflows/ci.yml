name: CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  market-collector:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.8'
          cache-dependency-path: services/market-collector/go.sum
      - run: test -z "$(gofmt -l .)"
        working-directory: services/market-collector
      - run: go vet ./...
        working-directory: services/market-collector
      - run: go test ./...
        working-directory: services/market-collector
      - run: docker build --tag market-collector:test .
        working-directory: services/market-collector

  quality:
    runs-on: ubuntu-latest
    env:
      APP_ENV: test
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/poe_worksmith_test
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: poe_worksmith_test
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d poe_worksmith_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.8.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm test:contracts
      - run: pnpm test:e2e:master:self-check
      - run: pnpm db:check:migrations
      - name: Verify staging Drizzle URL guard
        shell: bash
        run: |
          for query in \
            'sslmode=require&sslmode=disable' \
            'sslmode=require&uselibpqcompat=true' \
            'ssl%6Dode=require&x=%zz' \
            'sslmode=require&x=%ff'; do
            url="postgresql://postgres@127.0.0.1/postgres?$query"
            if output=$(env -u TEST_DATABASE_URL APP_ENV=staging DATABASE_SSL_MODE=require DATABASE_URL="$url" pnpm --filter @poe-worksmith/server exec drizzle-kit check --config drizzle.config.ts 2>&1); then
              echo "Unsafe staging URL was accepted: $query"
              exit 1
            fi
            case "$output" in
              *'Invalid database configuration: DATABASE_URL:'*) ;;
              *) echo "$output"; exit 1 ;;
            esac
          done
          env -u TEST_DATABASE_URL APP_ENV=staging DATABASE_SSL_MODE=require DATABASE_URL='postgresql://postgres@127.0.0.1/postgres?sslmode=require' pnpm --filter @poe-worksmith/server exec drizzle-kit check --config drizzle.config.ts
          if output=$(env -u TEST_DATABASE_URL -u APP_ENV DATABASE_URL='postgresql://postgres@127.0.0.1/postgres?sslmode=require' pnpm --filter @poe-worksmith/server exec drizzle-kit check --config drizzle.config.ts 2>&1); then
            echo 'Drizzle config accepted DATABASE_URL without APP_ENV'
            exit 1
          fi
          case "$output" in
            *'Invalid database configuration: APP_ENV:'*) ;;
            *) echo "$output"; exit 1 ;;
          esac
      - run: pnpm db:migrate
      - run: pnpm test:integration
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.8'
          cache-dependency-path: services/market-collector/go.sum
      - run: go test ./internal/store
        working-directory: services/market-collector
      - run: pnpm test:e2e:backend
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e:browser
      - name: Validate and preview recipe catalog
        run: |
          echo '## Recipe catalog' >> "$GITHUB_STEP_SUMMARY"
          pnpm --filter @poe-worksmith/server recipes:validate 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
          pnpm --filter @poe-worksmith/server recipes:sync --dry-run 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
      - run: docker build --target server --tag poe-worksmith:test .
      - run: docker build --target web --tag poe-worksmith-web:test .
